# Qualitätslauf (RB-04, NFA-07)
#
# Läuft bei jedem Push und bei jedem Pull Request. Auf `main` ist dieser
# Workflow als erforderliche Statusprüfung eingerichtet: Was hier rot ist,
# wird nicht zusammengeführt.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualitaet:
    name: Lint, Typen, Unit-Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typprüfung
        run: npm run typecheck

      - name: Unit-Tests mit Abdeckung
        run: npm run coverage

      - name: Dokumente prüfen
        run: npm run dokumente

      - name: Build
        run: npx vite build

      - name: Abdeckungsbericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Build sichern
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  e2e:
    name: End-to-End-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Browser installieren
        run: npx playwright install --with-deps chromium firefox

      - name: Build
        run: npx vite build

      - name: E2E-Tests
        run: npm run e2e

      - name: Bericht sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
