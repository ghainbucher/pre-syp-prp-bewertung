# Auslieferung der Testumgebung (RB-04)
#
# Zwei Dinge, die bewusst getrennt sind:
#
# - **Die Seite** wird von `main` nach GitHub Pages veröffentlicht. Sie ist
#   damit die jederzeit prüfbare Testumgebung.
# - **Das Release** entsteht aus dem Tag `vX.Y.Z`.
#
# Warum getrennt: `main` und der Tag zeigen beim Release auf denselben Commit.
# Beide Läufe nach Pages zu schieben, veröffentlicht zweimal dasselbe – und
# scheitert obendrein, weil die Umgebung `github-pages` nur `main` zulässt.
# Diese Schutzregel ist richtig und bleibt; der Workflow richtet sich nach ihr.
#
# Einmalig einzurichten: Repository → Settings → Pages → Source: GitHub Actions.

name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    name: Bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

      # Der Seitenabzug wird nur gebraucht, wenn auch veröffentlicht wird.
      - if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    name: Veröffentlichen
    # Nur von `main`: Ein Tag darf nicht nach `github-pages` schieben.
    if: github.ref == 'refs/heads/main'
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Release anlegen
    # Hängt an `bauen`, nicht an `veroeffentlichen`: Ein Release soll nicht
    # daran scheitern, dass die Seite gerade nicht ausgeliefert wird.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bauen
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
