name: Fehler melden
description: Etwas verhält sich anders als in der Anforderung beschrieben
title: "Fehler: "
labels: ["fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Ein Fehler wird zuerst als fehlschlagender Test abgebildet und erst dann behoben.
        So bleibt er behoben.
  - type: textarea
    id: erwartet
    attributes:
      label: Erwartetes Verhalten
      description: Womöglich mit Verweis auf die Anforderung und das Akzeptanzkriterium.
      placeholder: Laut FA-23/AK-1 sollte …
    validations:
      required: true
  - type: textarea
    id: tatsaechlich
    attributes:
      label: Tatsächliches Verhalten
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: umgebung
    attributes:
      label: Umgebung
      placeholder: Browser, Betriebssystem, Softwarestand
